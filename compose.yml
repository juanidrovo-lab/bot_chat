services:
  postgres:
    image: postgres:17-alpine
    # Sin `ports`: la base no se publica al exterior. Se llega por la red del compose.
    environment:
      POSTGRES_DB: providencia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d providencia']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  datos:
